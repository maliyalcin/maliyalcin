<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasarım Bülteni</title>
<meta name="theme-color" content="#1f2a37">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bülten">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e6ea;
    --accent: #e8711a; --accent-soft: #fdf0e6; --chip: #eef1f4; --hot: #c43d2b;
    --good: #1f8a4c; --good-soft: #e7f5ec; --bad: #c43d2b; --bad-soft: #fbeceb; --code: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a2129; --text: #e7ebef; --muted: #98a4b1; --line: #2a333d;
            --accent: #f08a3c; --accent-soft: #2b2119; --chip: #232c36; --hot: #ff7461;
            --good: #5cc98a; --good-soft: #17271e; --bad: #ff7461; --bad-soft: #2c1a18; --code: #222a33; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
  .bar { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; }
  .bar h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.nav { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  button.nav:disabled { opacity: .35; cursor: default; }
  .tabs { display: flex; max-width: 720px; margin: 8px auto 0; }
  .tabs a { flex: 1; text-align: center; padding: 10px 4px; font-weight: 600; font-size: 15px; color: var(--muted);
    text-decoration: none; border-bottom: 3px solid transparent; }
  .tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 32px); }
  .headline { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .headline span { display: block; font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  details.cat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  details.cat > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; gap: 10px; }
  details.cat > summary::-webkit-details-marker { display: none; }
  .ic { font-size: 22px; width: 30px; text-align: center; }
  .ct { flex: 1; font-weight: 700; }
  .ct small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .badge { min-width: 28px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted);
    font-size: 13px; font-weight: 700; text-align: center; }
  .badge.has { background: var(--accent); color: #fff; }
  .chev { color: var(--muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }
  ul.items { list-style: none; margin: 0; padding: 0 14px 6px; }
  li.item { border-top: 1px solid var(--line); padding: 12px 0; }
  li.item a.t { color: var(--text); text-decoration: none; font-weight: 650; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hot { color: var(--hot); font-weight: 700; }
  .sum { margin: 6px 0 0; font-size: 14.5px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font-size: 11.5px; background: var(--chip); color: var(--muted); padding: 2px 7px; border-radius: 6px; }
  .empty { padding: 4px 14px 14px; color: var(--muted); font-size: 14px; }
  .state { text-align: center; color: var(--muted); padding: 48px 12px; }
  .state b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }

  /* Tasarım listesi */
  a.dcard { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 12px; color: var(--text); text-decoration: none; align-items: center; }
  .dthumb { width: 96px; height: 72px; flex: none; border-radius: 10px; background: var(--code); overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .dthumb svg { width: 100%; height: 100%; }
  .dinfo { flex: 1; min-width: 0; }
  .dinfo b { display: block; font-size: 15.5px; line-height: 1.3; }
  .dinfo small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    padding: 1px 8px; border-radius: 99px; margin-bottom: 4px; }

  /* Tasarım detay */
  .dhead h2 { margin: 6px 0 4px; font-size: 21px; line-height: 1.25; }
  .dhead p { margin: 0 0 12px; color: var(--muted); }
  .v3d { position: relative; height: 300px; border-radius: 14px; overflow: hidden; background: var(--code); border: 1px solid var(--line); }
  .v3d canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  .v3d .hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .v3d .ctl { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
  .v3d .ctl button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 9px; font-size: 13px; }
  .v3d .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  section.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  section.box h3 { margin: 0 0 8px; font-size: 16.5px; }
  section.box p { margin: 0 0 10px; font-size: 15px; }
  section.box p:last-child { margin-bottom: 0; }
  figure { margin: 12px 0 0; }
  figure .svgw { background: #fff; border-radius: 10px; border: 1px solid var(--line); padding: 6px; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  table.kv, table.calc { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.kv td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 45%; }
  .calcblk { margin-top: 12px; }
  .calcblk h4 { margin: 0 0 6px; font-size: 15px; }
  .step { border-top: 1px solid var(--line); padding: 8px 0; }
  .step .lb { font-size: 14px; }
  .step code { display: block; background: var(--code); border-radius: 6px; padding: 5px 8px; margin: 4px 0; font-size: 13px;
    white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .step .res { font-weight: 700; color: var(--accent); }
  .step .nt { font-size: 12.5px; color: var(--muted); }
  .cmt { font-size: 14px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  ul.pc { margin: 0; padding-left: 20px; font-size: 14.5px; }
  ul.pc li { margin-bottom: 6px; }
  .pros h3 { color: var(--good); } .cons h3 { color: var(--bad); }
  .pros { background: var(--good-soft); } .cons { background: var(--bad-soft); }
  ul.comp { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
  ul.comp li { padding: 6px 0; border-top: 1px solid var(--line); }
  ul.comp li:first-child { border-top: 0; }
  .chat textarea { width: 100%; min-height: 80px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); padding: 10px; font: inherit; font-size: 15px; resize: vertical; }
  .chat .qs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chat .qs button { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 99px; padding: 5px 10px; font-size: 13px; }
  .chat .send { width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
  .chat .past { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .chat .past a { color: var(--muted); }
  .rev h3 .rs { font-size: 12px; font-weight: 700; color: #fff; background: var(--good); border-radius: 99px; padding: 2px 9px; vertical-align: 2px; margin-left: 6px; }
  .rev .cmt { margin-top: 8px; }
  /* Kelimeler */
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .flip { perspective: 900px; height: 170px; cursor: pointer; }
  .flip .in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
  .flip.on .in { transform: rotateY(180deg); }
  .flip .f, .flip .b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; justify-content: center; }
  .flip .f { background: var(--card); text-align: center; }
  .flip .f b { font-size: 16px; line-height: 1.25; }
  .flip .f i { font-style: normal; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .flip .f .chip { align-self: center; font-size: 10.5px; }
  .flip .b { background: var(--accent-soft); transform: rotateY(180deg); font-size: 12.5px; line-height: 1.35; overflow-y: auto; justify-content: flex-start; padding: 10px; }
  .flip .b a { color: var(--accent); font-weight: 700; text-decoration: none; margin-top: 6px; font-size: 13px; }
  .flip .ok { position: absolute; top: 8px; right: 10px; color: var(--good); font-weight: 800; }
  .hint2 { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
  h3.sec { margin: 22px 2px 10px; font-size: 16.5px; }
  a.btn { display: block; text-align: center; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none;
    padding: 12px; border-radius: 12px; margin-top: 14px; }
  .hook { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .qz .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 10px 12px; margin-top: 8px; font: inherit; font-size: 14.5px; }
  .qz .opt.right { background: var(--good-soft); border-color: var(--good); }
  .qz .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .qz .why { display: none; margin-top: 8px; font-size: 14px; }
  .qz.done .why { display: block; }
  .known { width: 100%; margin-top: 12px; border: 1px solid var(--good); color: var(--good); background: var(--good-soft);
    border-radius: 10px; padding: 11px; font: inherit; font-weight: 700; }
  .score { text-align: center; font-size: 18px; font-weight: 800; margin: 16px 0 4px; }
  a.back { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Önceki gün">‹</button>
    <h1 id="ttl">Tasarım Bülteni<small id="day">Yükleniyor…</small></h1>
    <button class="nav" id="next" aria-label="Sonraki gün">›</button>
  </div>
  <nav class="tabs">
    <a href="#/haber" id="t-haber">📰 Haberler</a>
    <a href="#/tasarim" id="t-tasarim">⚙️ Tasarım</a>
    <a href="#/kelime" id="t-kelime">📚 Kelimeler</a>
  </nav>
</header>
<main id="main"><div class="state">Yükleniyor…</div></main>
<script src="app.js"></script>
</body>
</html>
