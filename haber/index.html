<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasarım Bülteni</title>
<meta name="theme-color" content="#1f2a37">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bülten">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e6ea;
    --accent: #e8711a; --accent-soft: #fdf0e6; --chip: #eef1f4; --hot: #c43d2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a2129; --text: #e7ebef; --muted: #98a4b1; --line: #2a333d;
            --accent: #f08a3c; --accent-soft: #2b2119; --chip: #232c36; --hot: #ff7461; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .bar { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; }
  .bar h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
  button.nav { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  button.nav:disabled { opacity: .35; cursor: default; }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 32px); }
  .headline { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .headline span { display: block; font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  details.cat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  details.cat > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; gap: 10px; }
  details.cat > summary::-webkit-details-marker { display: none; }
  .ic { font-size: 22px; width: 30px; text-align: center; }
  .ct { flex: 1; font-weight: 700; }
  .ct small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .badge { min-width: 28px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted);
    font-size: 13px; font-weight: 700; text-align: center; }
  .badge.has { background: var(--accent); color: #fff; }
  .chev { color: var(--muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }
  ul.items { list-style: none; margin: 0; padding: 0 14px 6px; }
  li.item { border-top: 1px solid var(--line); padding: 12px 0; }
  li.item a.t { color: var(--text); text-decoration: none; font-weight: 650; }
  li.item a.t:active { color: var(--accent); }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hot { color: var(--hot); font-weight: 700; }
  .sum { margin: 6px 0 0; font-size: 14.5px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font-size: 11.5px; background: var(--chip); color: var(--muted); padding: 2px 7px; border-radius: 6px; }
  .empty { padding: 4px 14px 14px; color: var(--muted); font-size: 14px; }
  .state { text-align: center; color: var(--muted); padding: 48px 12px; }
  .state b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Önceki gün">‹</button>
    <h1>Tasarım Bülteni<small id="day">Yükleniyor…</small></h1>
    <button class="nav" id="next" aria-label="Sonraki gün">›</button>
  </div>
</header>
<main id="main"><div class="state">Yükleniyor…</div></main>
<script src="app.js"></script>
</body>
</html>
